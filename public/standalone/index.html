<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIMAK - Sistem Informasi Manajemen Kelas (SPA)</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SweetAlert2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- jsPDF CDN for PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Firebase Web SDK App & Database (v9 compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans antialiased selection:bg-blue-600 selection:text-white">

  <!-- TOPBAR NAVBAR -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center font-black text-lg shadow-sm">
          S
        </div>
        <div>
          <h1 class="text-base font-bold text-slate-800 leading-tight">SIMAK</h1>
          <p class="text-[11px] text-slate-500">Sistem Manajemen Kelas (SPA Firebase)</p>
        </div>
      </div>

      <!-- Quick Session Indicator & Logout Button -->
      <div id="session-container" class="flex items-center gap-3">
        <!-- Rendered dynamically by app.js -->
      </div>
    </div>
  </header>

  <!-- MAIN SPA CONTENT CONTAINER -->
  <div class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <!-- Dynamic View Injected Here -->
    <div id="app-viewport">
      <!-- Loading State / View Content -->
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
    SIMAK © 2026 - RDBMS di Atas Firebase NoSQL Realtime Database
  </footer>

  <!-- Main JavaScript Logic -->
  <script src="./app.js"></script>
</body>
</html>
