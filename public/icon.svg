<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#grad)"/>
  
  <!-- Graduation Cap / School Emblem -->
  <g transform="translate(96, 120)">
    <!-- Cap Top Diamond -->
    <polygon points="160,20 320,85 160,150 0,85" fill="#ffffff" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.2))"/>
    <polygon points="160,40 280,85 160,130 40,85" fill="#f1f5f9"/>
    <!-- Cap Skull Base -->
    <path d="M 60,115 L 60,180 Q 160,240 260,180 L 260,115 Q 160,170 60,115 Z" fill="#ffffff" opacity="0.95"/>
    
    <!-- Tassel -->
    <path d="M 280,95 L 305,140 L 305,210" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="305" cy="215" r="10" fill="url(#accent)"/>
    <path d="M 298,225 L 312,225 L 316,260 L 294,260 Z" fill="url(#accent)"/>

    <!-- Open Book at bottom -->
    <g transform="translate(30, 160)">
      <path d="M 130,50 C 90,30 30,35 0,55 L 0,110 C 30,90 90,85 130,105 Z" fill="#ffffff" opacity="0.9"/>
      <path d="M 130,50 C 170,30 230,35 260,55 L 260,110 C 230,90 170,85 130,105 Z" fill="#ffffff" opacity="0.9"/>
      <line x1="130" y1="48" x2="130" y2="108" stroke="#cbd5e1" stroke-width="4"/>
    </g>
  </g>
</svg>
